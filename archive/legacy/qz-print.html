<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test Stampa LAN con Immagine - POS-80C</title>
    <!-- Inclusione della libreria ufficiale qz-tray -->
    <script src="qz-tray.js"></script>
</head>
<body>
    <h2>Stampa di Prova con Logo su POS-80C (192.168.88.22)</h2>
    <button onclick="stampaScontrino()">Stampa Logo e Testo</button>

    <script>
       function stampaScontrino() {
    // 1. Definiamo il percorso assoluto dell'immagine sul tuo server locale
    var imageUrl = '../uploads/gcf_thermal.png';

    // 2. Usiamo una funzione JavaScript per convertire l'immagine in Base64
    var xhr = new XMLHttpRequest();
    xhr.onload = function() {
        var reader = new FileReader();
        reader.onloadend = function() {
            // Questo è il contenuto in Base64 puro (rimuoviamo l'header data:image/png;base64,)
            var base64Data = reader.result.split(',')[1];
            
            // Una volta ottenuto il Base64, avviamo il processo di stampa
            inviaAStampante(base64Data);
        }
        reader.readAsDataURL(xhr.response);
    };
    xhr.open('GET', imageUrl);
    xhr.responseType = 'blob';
    xhr.send();
}

function inviaAStampante(base64Image) {
    qz.websocket.connect({ host: "192.168.88.32" })
        .then(function() {
            // Qui possiamo tornare alla configurazione base
            var config = qz.configs.create("POS-80C");

            var data = [
                '\x1B' + '\x40',          // Init
                '\x1B' + '\x61' + '\x31', // Centrato

                // BLOCCO IMMAGINE CORRETTO
                { 
                    type: 'raw',          // MODIFICA 1: Deve essere 'raw', non 'pixel'
                    format: 'image', 
                    flavor: 'base64', 
                    data: base64Image,
                    options: {  
                        language: 'ESCPOS', // MODIFICA 2: Il linguaggio va specificato qui dentro!
                        dotDensity: 'double'
                    }
                },

                '\x0A', 
                '*** TEST STAMPA LAN ***\n',
                '-------------------------\n',
                'Ricevuto da QZ Tray\n',
                '-------------------------\n',
                '\x1B' + '\x61' + '\x30', // Sinistra
                'IP Server: 192.168.88.22\n',
                'Stampante: POS-80C\n',
                '\x0A\x0A\x0A\x0A\x0A',   
                '\x1D' + '\x56' + '\x41' + '\x00' // Taglio
            ];

            return qz.print(config, data);
        })
        .then(function() {
            alert("Stampa inviata con successo!");
            return qz.websocket.disconnect();
        })
        .catch(function(err) {
            console.error(err);
            alert("Errore di stampa: " + err.message);
        });
}
    </script>
</body>
</html>
