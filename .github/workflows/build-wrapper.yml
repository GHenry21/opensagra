name: Build wrapper

# Equivalente CI di wrapper\build.ps1 (stessi passi: vet + build, CGO_ENABLED=0,
# -H=windowsgui). Produce l'exe come artefatto scaricabile - non pubblica, non
# firma (vedi PIANO-MODIFICHE-WRAPPER.md: firma SmartScreen decisa NO).
#
# Inerte finche' il repo non ha un remote GitHub: gira solo li'.

on:
  push:
    branches: [main]
    paths:
      - "wrapper/**"
      - ".github/workflows/build-wrapper.yml"
  pull_request:
    paths:
      - "wrapper/**"
  workflow_dispatch: {} # per lanciarla a mano dalla tab Actions

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wrapper
    env:
      CGO_ENABLED: "0" # tutte le dipendenze sono puro Go (nessun compilatore C richiesto)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: go vet
        run: go vet ./...

      # La finestra di stato e' una pagina HTML con il suo JavaScript, servita
      # dal wrapper: un errore di sintassi la blocca del tutto su ogni OS e i
      # test che usano le API del wrapper non se ne accorgono (successo il
      # 2026-10-15: un a capo vero dentro una stringa, corretto in bab0631).
      - name: Sintassi JavaScript della finestra di stato
        shell: bash
        # Solo Node (c'e' su tutti i runner): new Function() compila senza eseguire.
        run: |
          node -e "const s=require('fs').readFileSync('status_page.html','utf8'); const js=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n'); new Function(js); console.log('sintassi ok, ' + js.length + ' caratteri')"

      - name: go build
        run: go build -ldflags "-H=windowsgui" -o opensagra-wrapper.exe .

      - name: Info versione (verifica rapida)
        shell: pwsh
        run: |
          $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("opensagra-wrapper.exe")
          "$($v.ProductName) v$($v.FileVersion) - $($v.FileDescription)"
          (Get-Item opensagra-wrapper.exe).Length

      - uses: actions/upload-artifact@v4
        with:
          name: opensagra-wrapper
          path: wrapper/opensagra-wrapper.exe
          retention-days: 30
