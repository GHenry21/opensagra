name: Test password installer grafico (Linux)

# La schermata della password dell'installer grafico (installer/sudo_unix.go)
# provata fino a installazione completata, con un utente che NON ha sudo
# senza password - il caso di un PC vero. Sul runner, sul Pi e sul runner
# macOS sudo e' NOPASSWD, quindi la schermata non compariva mai (piano, 5h).
#
# Utente "cassa" creato apposta: nel gruppo sudo, con password, niente
# NOPASSWD. L'installer del pacchetto ("Installa OpenSagra") gira come lui;
# la sua pagina si apre in Chrome in modalita' app su uno schermo virtuale
# (Xvfb) - aperto dal runner, vedi il passo d'installazione per il perche' - e
# la password si scrive NELLA FINESTRA con xdotool (tastiera simulata su X11),
# come farebbe una persona: prima una sbagliata (deve comparire "Password
# errata"), poi quella giusta. Da li' ogni sudo di install.sh passa dal
# sostituto di sudo + SUDO_ASKPASS dell'installer.
#
# Su un desktop la sessione systemd --user esiste dal login: qui la si crea
# abilitando il linger dell'utente prima di lanciare l'installer.

on:
  push:
    branches: [gui-password]
  workflow_dispatch: {}

jobs:
  password:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: intl, mbstring, gd, zip, curl, openssl, dom, fileinfo

      - name: composer install (rigenera vendor/, non e' nel repo)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: |
            wrapper/go.sum
            installer/go.sum

      - name: Costruisci il pacchetto linux x86_64
        run: |
          bash packaging/make-unix-package.sh linux x86_64
          mkdir -p "$RUNNER_TEMP/out"; echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Utente "cassa" con sudo che chiede la password
        run: |
          set -x
          # Come in test-ubuntu.yml: il MySQL del runner va tolto (porta 3306).
          sudo systemctl stop mysql 2>/dev/null || true
          sudo apt-get purge -y -qq 'mysql-*' >/dev/null 2>&1 || true
          sudo rm -rf /etc/mysql /var/lib/mysql
          sudo apt-get install -y -qq xvfb xdotool imagemagick >/dev/null
          pw="$(openssl rand -hex 8)"
          echo "::add-mask::$pw"
          echo "CASSA_PW=$pw" >> "$GITHUB_ENV"
          sudo useradd -m -s /bin/bash -G sudo cassa
          echo "cassa:$pw" | sudo chpasswd
          # Nessuna regola NOPASSWD per cassa: sudo deve chiedere la password.
          sudo grep -rn cassa /etc/sudoers /etc/sudoers.d/ && { echo "::error::regola sudo inattesa per cassa"; exit 1; } || true
          if sudo -u cassa sudo -n true 2>/dev/null; then echo "::error::cassa ha sudo senza password"; exit 1; fi
          echo "sudo di cassa: chiede la password, come su un PC vero"
          uid=$(id -u cassa); echo "CASSA_UID=$uid" >> "$GITHUB_ENV"
          sudo loginctl enable-linger cassa
          # /run/user/<uid> e' privato di cassa (0700): si guarda con sudo.
          for i in $(seq 1 20); do sudo test -S "/run/user/$uid/bus" && break; sleep 1; done
          sudo test -S "/run/user/$uid/bus"
          # Pacchetto nella home di cassa, come dopo il download.
          sudo tar -xzf opensagra-*-linux-x86_64.tar.gz -C /home/cassa
          sudo chown -R cassa:cassa /home/cassa
          pkg=$(sudo bash -c 'ls -d /home/cassa/opensagra-*/' | head -1)
          echo "PKG=${pkg%/}" >> "$GITHUB_ENV"
          sudo test -x "${pkg%/}/Installa OpenSagra"

      - name: Installa OpenSagra come "cassa", password scritta nella finestra
        timeout-minutes: 30
        run: |
          Xvfb :99 -ac -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          shot() { import -window root "$OUT/$1.png" 2>/dev/null || true; }
          ( i=0; while :; do sleep 5; i=$((i+1)); shot "gui-$(printf %03d $i)"; done ) &
          shooter=$!

          # L'installer come utente cassa, con la sua sessione systemd --user. E'
          # lui che chiede la password, la verifica (sudo -S -v) e la passa a
          # ogni sudo di install.sh (sostituto di sudo + SUDO_ASKPASS).
          #
          # La finestra pero' la apre il runner: su questa immagine GitHub
          # Chrome va in crash all'avvio (SIGTRAP, "chrome_crashpad_handler:
          # --database is required") per QUALUNQUE utente diverso da runner -
          # anche con login completo (su -), senza sandbox, binario diretto,
          # utente nuovo fuori dal gruppo sudo (diagnostica, 2026-10-15). Non
          # succede su una macchina vera (Pi, test Ubuntu come runner). Quindi
          # l'installer gira con -headless (stampa l'indirizzo della pagina
          # invece di aprire il browser) e la stessa pagina si apre in Chrome
          # modalita' app come runner: identica alla finestra normale.
          sudo -u cassa -H env DISPLAY=:99 XDG_RUNTIME_DIR=/run/user/$CASSA_UID \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$CASSA_UID/bus \
            "$PKG/Installa OpenSagra" -headless > "$OUT/installer-stdout.txt" 2>&1 &
          inst=$!
          url=""
          for i in $(seq 1 30); do
            url=$(grep -m1 -oE 'http://127\.0\.0\.1:[0-9]+/[^ ]*' "$OUT/installer-stdout.txt" 2>/dev/null || true)
            [ -n "$url" ] && break; sleep 1
          done
          [ -n "$url" ] || { cat "$OUT/installer-stdout.txt"; echo "::error::l'installer non ha stampato l'indirizzo della pagina"; exit 1; }
          echo "::add-mask::${url#*#}"
          # Stesse preferenze che l'installer scrive nel suo profilo
          # (disablePasswordManager in installer/display_chromium.go): niente
          # "Salvare la password?" sopra la finestra dopo l'invio.
          mkdir -p "$RUNNER_TEMP/finestra/Default"
          echo '{"credentials_enable_service":false,"profile":{"password_manager_enabled":false},"autofill":{"profile_enabled":false,"credit_card_enabled":false}}' > "$RUNNER_TEMP/finestra/Default/Preferences"
          google-chrome --app="$url" --user-data-dir="$RUNNER_TEMP/finestra" --window-size=476,420 \
            --no-first-run --no-default-browser-check --disable-features=Translate >/dev/null 2>&1 &
          chrome=$!

          # La finestra (Chrome app-mode, titolo della pagina).
          win=""
          for i in $(seq 1 60); do
            win=$(xdotool search --name "Installazione OpenSagra" 2>/dev/null | head -1 || true)
            [ -n "$win" ] && break; sleep 1
          done
          [ -n "$win" ] || { shot finestra-mancante; cat "$OUT/installer-stdout.txt"; echo "::error::finestra dell'installer non comparsa"; exit 1; }
          # Stato dell'installer dalla sua API (stesso token della pagina):
          # serve a sapere quando un tentativo e' arrivato davvero. La pagina
          # puo' metterci a caricarsi: i tasti battuti prima andrebbero persi
          # (visto 2026-10-15), quindi ogni tentativo si ripete finche' non ha
          # effetto, invece di contare su un'attesa fissa.
          token="${url#*#}"; base="${url%%/\?*}"
          phase() { curl -s -H "X-Token: $token" "$base/api/state" | python3 -c 'import sys,json; print(json.load(sys.stdin)["phase"])' 2>/dev/null || true; }
          rifiuti() { sudo journalctl -q _COMM=sudo --no-pager | grep -c "cassa : .*incorrect password" || true; }
          for i in $(seq 1 30); do [ "$(phase)" = password ] && break; sleep 1; done
          [ "$(phase)" = password ] || { echo "::error::l'installer non e' arrivato alla schermata della password (fase: $(phase))"; exit 1; }
          # Niente window manager su Xvfb: la tastiera va alla finestra sotto il
          # puntatore. Il campo password ha il focus (autofocus della pagina).
          eval "$(xdotool getwindowgeometry --shell "$win")"
          xdotool mousemove $((X + WIDTH / 2)) $((Y + HEIGHT / 2))
          sleep 3
          shot pw-1-richiesta

          # 1) Password sbagliata: sudo la rifiuta e la finestra resta sulla
          #    schermata della password, con l'errore.
          prima=$(rifiuti)
          for t in 1 2 3 4 5; do
            xdotool type --delay 60 "sbagliata-di-proposito"; xdotool key Return
            sleep 5
            [ "$(rifiuti)" -gt "$prima" ] && break
            echo "tentativo $t con la password sbagliata non arrivato alla finestra, riprovo"
          done
          [ "$(rifiuti)" -gt "$prima" ] || { shot pw-2-mai-arrivata; echo "::error::la password sbagliata non e' mai arrivata a sudo"; exit 1; }
          echo "sudo ha rifiutato la password sbagliata (come atteso)"
          [ "$(phase)" = password ] || { echo "::error::dopo la password sbagliata l'installer non e' rimasto sulla schermata della password"; exit 1; }
          shot pw-2-sbagliata

          # 2) Password giusta: l'installer esce dalla schermata e parte.
          for t in 1 2 3 4 5; do
            xdotool type --delay 60 "$CASSA_PW"; xdotool key Return
            sleep 6
            [ "$(phase)" != password ] && break
            echo "tentativo $t con la password giusta non arrivato alla finestra, riprovo"
          done
          [ "$(phase)" != password ] || { shot pw-3-ferma; echo "::error::l'installer e' rimasto sulla schermata della password"; exit 1; }
          echo "password accettata, fase: $(phase)"
          shot pw-3-avvio

          rc=0; wait $inst || rc=$?
          kill $shooter $chrome 2>/dev/null || true
          echo "installer grafico (utente cassa): exit $rc"
          tail -n 5 /tmp/opensagra-install.log
          [ "$rc" -eq 0 ]

      - name: Verifica installazione (utente cassa)
        run: |
          cx() { sudo -u cassa -H env XDG_RUNTIME_DIR=/run/user/$CASSA_UID DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$CASSA_UID/bus bash -c "$1"; }
          set -x
          cx 'systemctl --user is-active opensagra-wrapper.service'
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)
          echo "https://localhost -> $code"; [ "$code" -ge 200 ] && [ "$code" -lt 400 ]
          sudo mariadb -e 'SHOW DATABASES' | grep opensagra_pos
          cx 'test -f $HOME/opensagra/config/variabili.env'
          # I sudo di install.sh sono passati davvero da cassa con password
          # (askpass dell'installer), non da un sudo gia' sbloccato del runner.
          sudo journalctl -q _COMM=sudo --no-pager | grep -E 'cassa : ' | tee "$OUT/sudo-cassa.txt" | tail -n 15
          grep -q 'COMMAND=' "$OUT/sudo-cassa.txt"
          # Nessun residuo dell'installer (sostituto di sudo, askpass) in /tmp.
          ls -d /tmp/opensagra-installer-* 2>/dev/null && { echo "::error::residui dell'installer in /tmp"; exit 1; } || true
          # Ancora nessun NOPASSWD: l'installazione non ha cambiato i permessi.
          if sudo -u cassa sudo -n true 2>/dev/null; then echo "::error::cassa ora ha sudo senza password"; exit 1; fi

      - name: Log
        if: always()
        run: |
          sudo cp /tmp/opensagra-install.log "$OUT/" 2>/dev/null || true
          sudo chmod -R a+r "$OUT" || true
          tail -n 40 "$OUT/opensagra-install.log" 2>/dev/null || true
          cat "$OUT/installer-stdout.txt" 2>/dev/null | tail -n 20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-gui-password
          path: ${{ env.OUT }}
          retention-days: 14
