name: Release

# Compila l'intero pacchetto (wrapper + opensagra-installer.exe +
# opensagra-uninstaller.exe) e li allega a una Release quando si pusha un tag
# "v*" - stessa identica pipeline usata in locale (wrapper/build.ps1 +
# packaging/make-installer.ps1 + make-uninstaller.ps1), nessuna logica
# duplicata qui dentro: se cambia il modo di impacchettare, cambia solo li'.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # per testare la pipeline senza dover taggare davvero

permissions:
  contents: write # per creare la Release e allegarci gli asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # serve tutta la storia dei tag per il confronto con la release precedente, sotto

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          # Stesse estensioni che install.ps1 configura nel php.ini di
          # FrankenPHP sulla macchina finale - servono qui solo per far
          # passare il controllo dei requisiti di Composer (mike42/escpos-php
          # vuole ext-intl), il codice PHP non gira affatto in questo job.
          extensions: intl, mbstring, gd, zip, curl, openssl, dom, fileinfo

      - name: composer install (rigenera vendor/, non e' nel repo)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Installa il modulo ps2exe
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Compila l'installer (compila anche wrapper e disinstaller al suo interno)
        shell: powershell
        run: .\packaging\make-installer.ps1

      - name: Info versione (verifica rapida)
        shell: powershell
        run: |
          foreach ($f in 'opensagra-installer.exe', 'opensagra-uninstaller.exe') {
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($f)
            "$f - $($v.ProductName) v$($v.FileVersion) - $((Get-Item $f).Length) byte"
          }

      # Un aggiornamento leggero (opensagra-update.zip, vedi packaging/make-update.ps1
      # e wrapper/self_update.go) sostituisce solo il codice app senza reinstallare -
      # e' sicuro offrirlo SOLO se questa release non tocca wrapper/, install.ps1,
      # uninstall.ps1 o packaging/ rispetto al tag precedente. Se manca un tag
      # precedente (prima release) si va sempre di reinstallazione completa: non c'e'
      # niente con cui confrontarsi.
      - name: Determina se serve il pacchetto di aggiornamento leggero
        id: diff
        shell: powershell
        run: |
          $currentTag = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}" } else { $null }
          $allTags = git tag --sort=-v:refname
          $prevTag = $allTags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1

          if (-not $prevTag) {
            Write-Host "Nessun tag precedente trovato: prima release, nessun aggiornamento leggero."
            "needsFull=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Confronto con il tag precedente: $prevTag"
            $changed = git diff --name-only "$prevTag" HEAD -- wrapper/ install.ps1 uninstall.ps1 packaging/
            if ($changed) {
              Write-Host "File rilevanti cambiati rispetto a ${prevTag}:"
              $changed | ForEach-Object { Write-Host "  $_" }
              "needsFull=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              Write-Host "Nessuna modifica a wrapper/installer/uninstaller rispetto a $prevTag - allego anche l'aggiornamento leggero."
              "needsFull=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }

      - name: Compila il pacchetto di aggiornamento leggero
        if: steps.diff.outputs.needsFull == 'false'
        shell: powershell
        run: .\packaging\make-update.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: opensagra-installers
          path: |
            opensagra-installer.exe
            opensagra-uninstaller.exe
            opensagra-update.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opensagra-installer.exe
            opensagra-uninstaller.exe
            opensagra-update.zip
          generate_release_notes: true
