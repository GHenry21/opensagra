name: Release

# Compila l'intero pacchetto (wrapper + opensagra-installer.exe +
# opensagra-uninstaller.exe) e li allega a una Release quando si pusha un tag
# "v*" - stessa identica pipeline usata in locale (wrapper/build.ps1 +
# packaging/make-installer.ps1 + make-uninstaller.ps1), nessuna logica
# duplicata qui dentro: se cambia il modo di impacchettare, cambia solo li'.
# Il job unix-packages allega anche i pacchetti Linux/macOS
# (packaging/make-unix-package.sh). Entrambi includono FrankenPHP della
# versione fissata in packaging/frankenphp.sha256.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # per testare la pipeline senza dover taggare davvero

permissions:
  contents: write # per creare la Release e allegarci gli asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag esatto su HEAD -> versione (packaging/Get-ReleaseVersion.ps1, git describe)

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          # Stesse estensioni che install.ps1 configura nel php.ini di
          # FrankenPHP sulla macchina finale - servono qui solo per far
          # passare il controllo dei requisiti di Composer (mike42/escpos-php
          # vuole ext-intl), il codice PHP non gira affatto in questo job.
          extensions: intl, mbstring, gd, zip, curl, openssl, dom, fileinfo

      - name: composer install (rigenera vendor/, non e' nel repo)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Installa il modulo ps2exe
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber

      - name: Compila l'installer (compila anche wrapper e disinstaller al suo interno)
        shell: powershell
        run: .\packaging\make-installer.ps1

      - name: Info versione (verifica rapida)
        shell: powershell
        run: |
          foreach ($f in 'opensagra-installer.exe', 'opensagra-uninstaller.exe') {
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($f)
            "$f - $($v.ProductName) v$($v.FileVersion) - $((Get-Item $f).Length) byte"
          }

      # Aggiornamento leggero (opensagra-app-update.zip + .sha256, vedi
      # packaging/make-update.ps1 e wrapper/self_update.go): allegato a OGNI
      # release. Se una data installazione puo' usarlo o deve reinstallare lo
      # decide il wrapper, dal diff fra il SUO tag installato e questo
      # (lightUpdatePlan in wrapper/update_check.go, piano Fase 6a) - qui si
      # vedeva solo il tag precedente, e chi saltava una release che
      # richiedeva la reinstallazione riceveva lo zip lo stesso. Il nome
      # nuovo (non piu' opensagra-update.zip) tiene fuori i wrapper vecchi,
      # che lo applicherebbero alla cieca: ricadono su "reinstallazione".
      - name: Compila il pacchetto di aggiornamento leggero
        shell: powershell
        run: .\packaging\make-update.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: opensagra-installers
          path: |
            opensagra-installer.exe
            opensagra-uninstaller.exe
            opensagra-app-update.zip
            opensagra-app-update.zip.sha256
          retention-days: 30
          if-no-files-found: ignore

      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opensagra-installer.exe
            opensagra-uninstaller.exe
            opensagra-app-update.zip
            opensagra-app-update.zip.sha256
          generate_release_notes: true

  # Pacchetti Linux/macOS (packaging/make-unix-package.sh): un archivio per
  # OS/architettura con codice app, vendor/, wrapper e FrankenPHP della versione
  # fissata (impronta verificata: se FrankenPHP ha ricompilato l'asset, fallisce
  # QUESTO job, non l'installazione di un utente). Runner Linux per tutti: il
  # wrapper si cross-compila (pure Go) e FrankenPHP si scarica soltanto.
  unix-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: x86_64 }
          - { os: linux, arch: aarch64 }
          - { os: macos, arch: arm64 }
          - { os: macos, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag esatto su HEAD -> file VERSION del pacchetto

      - name: Versione FrankenPHP coerente tra installer e packaging/frankenphp.sha256
        run: |
          lock=$(sed -n 's/^#[[:space:]]*version:[[:space:]]*\([^[:space:]]*\).*/\1/p' packaging/frankenphp.sha256)
          echo "lock: $lock"
          grep -q "^FRANKENPHP_VERSION=\"$lock\"" install.sh
          grep -q "^FRANKENPHP_VERSION=\"$lock\"" install-macos.sh
          grep -q "^\$Script:FrankenPhpVersion = '$lock'" install.ps1

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: intl, mbstring, gd, zip, curl, openssl, dom, fileinfo

      - name: composer install (rigenera vendor/, non e' nel repo)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Costruisci il pacchetto ${{ matrix.target.os }}-${{ matrix.target.arch }}
        run: bash packaging/make-unix-package.sh ${{ matrix.target.os }} ${{ matrix.target.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: opensagra-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: opensagra-*-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
          retention-days: 30

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: opensagra-*-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
