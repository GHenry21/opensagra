<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Stampa RawBT ESC/POS</title>
</head>
<body>

    <h2>Test di stampa ESC/POS con RawBT</h2>
    <button onclick="stampaDati()" style="padding: 15px; font-size: 18px;">STAMPA ORA</button>

    <script>
        function stampaDati() {
            // 1. Definizione dei comandi ESC/POS in array di byte
            let ESC = 0x1B;
            let GS = 0x1D;
            
            let bytes = [];

            // Inizializza stampante
            bytes.push(ESC, 0x40);

            // Allineamento Centrato (ESC a 0x61 0x01)
            bytes.push(ESC, 0x61, 0x01);

            // Grassetto ON (ESC E 1)
            bytes.push(ESC, 0x45, 0x01);
            
            // Testo normale convertito in byte (UTF-8 o ASCII)
            let titolo = "TEST NEGOZIO\n";
            for (let i = 0; i < titolo.length; i++) {
                bytes.push(titolo.charCodeAt(i));
            }

            // Grassetto OFF (ESC E 0)
            bytes.push(ESC, 0x45, 0x00);
            
            // Allineamento a Sinistra (ESC a 0x61 0x00)
            bytes.push(ESC, 0x61, 0x00);

            let testo = "--------------------------------\n";
            testo += "Articolo 1        EUR 10.00\n";
            testo += "Articolo 2        EUR  5.50\n";
            testo += "--------------------------------\n";
            testo += "TOTALE            EUR 15.50\n\n";
            testo += "Grazie per la visita!\n\n\n";

            for (let i = 0; i < testo.length; i++) {
                bytes.push(testo.charCodeAt(i));
            }

            // Comando di taglio carta (GS V 66 0)
            bytes.push(GS, 0x56, 0x42, 0x00);

            // 2. Conversione dell'array di byte in stringa Base64
            let binaryString = String.fromCharCode.apply(null, bytes);
            let base64Data = btoa(binaryString);

            // 3. Creazione dell'URI scheme per RawBT
            // Il prefisso "base64," dice a RawBT di decodificare i dati grezzi ESC/POS
            let rawbtUri = "rawbt:base64," + base64Data;

            // 4. Apertura dell'Intent/URI verso l'app RawBT
            window.location.href = rawbtUri;
        }
    </script>

</body>
</html>
