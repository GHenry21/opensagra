services:
  web:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.2-apache

        RUN apt-get update && apt-get install -y --no-install-recommends \
                libicu-dev \
                libfreetype6-dev \
                libjpeg62-turbo-dev \
                libpng-dev \
                libzip-dev \
                libonig-dev \
            && docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install mysqli gd intl zip mbstring \
            && a2enmod rewrite \
            && apt-get purge -y --auto-remove libicu-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libzip-dev libonig-dev \
            && rm -rf /var/lib/apt/lists/*
    container_name: opensagra-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /mnt/data/apps/opensagra/www:/var/www/html
    depends_on:
      - db
    networks:
      - opensagra

  db:
    image: mariadb:11.4
    container_name: opensagra-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: opensagra_pos
      MYSQL_USER: ${DB_POS_USER}
      MYSQL_PASSWORD: ${DB_POS_PASS}
    volumes:
      - /mnt/data/apps/opensagra/db:/var/lib/mysql
    networks:
      - opensagra

  phpmyadmin:
    image: phpmyadmin:5
    container_name: opensagra-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - opensagra

networks:
  opensagra:
    driver: bridge
